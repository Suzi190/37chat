name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'android/**'
      - 'tools/prepare-apk-assets.mjs'
      - 'tools/check-html-syntax.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: 打包 云曰 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 明确装好 compileSdk 需要的平台和构建工具，避免 AGP 现场下载超时
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 把 app/ 里的网页、vendor 资源同步进 assets/www，并给 viewport 打补丁
      - name: 同步 Web 资源
        run: node tools/prepare-apk-assets.mjs

      # 内联脚本语法自检：漏写一个 </script> 就会让 1.4MB 主脚本整体变成语法错误，
      # 页面一行 JS 都跑不起来（白屏卡开屏），而且浏览器不给任何提示，所以卡在这里。
      - name: 校验内联脚本语法
        run: node tools/check-html-syntax.mjs

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 有密钥就用密钥签名，没有就退回 debug 签名（APK 一样能装）
      - name: 准备签名密钥（可选）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yunyue.jks"
            echo "YUNYUE_KEYSTORE=$RUNNER_TEMP/yunyue.jks" >> "$GITHUB_ENV"
            echo "已找到签名密钥，将输出正式签名包"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，使用 debug 签名"
          fi

      - name: 编译 APK
        working-directory: android
        env:
          YUNYUE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YUNYUE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YUNYUE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/yunyue.apk
          # debug 包带 .debug 后缀的包名，方便和正式包同时装
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/yunyue-debug.apk
          ls -lh dist

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: yunyue-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
